<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>局域网聊天室</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, "Microsoft YaHei", "PingFang SC", sans-serif;
    background: #eef1f5;
  }

  #app {
    max-width: 760px;
    height: 100%;
    margin: 0 auto;
    display: flex;
    flex-direction: column;
    background: #fff;
    box-shadow: 0 0 24px rgba(0,0,0,.06);
  }

  header {
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 14px 18px;
    background: #4a6cf7;
    color: #fff;
    flex-shrink: 0;
  }
  header h1 { font-size: 18px; font-weight: 600; }
  .me-badge {
    margin-left: auto;
    font-size: 12px;
    background: rgba(255,255,255,.2);
    padding: 4px 10px;
    border-radius: 999px;
  }

  #chat {
    flex: 1;
    overflow-y: auto;
    padding: 16px 14px;
  }

  /* 别人的消息：靠左 */
  .msg { display: flex; margin-bottom: 12px; }
  .msg .avatar {
    width: 36px; height: 36px;
    border-radius: 50%;
    background: #4a6cf7;
    color: #fff;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px;
    flex-shrink: 0;
  }
  .msg .body { margin-left: 10px; max-width: 72%; }
  .msg .name { font-size: 12px; color: #999; margin-bottom: 3px; }
  .msg .bubble {
    background: #f1f3f7;
    padding: 9px 12px;
    border-radius: 4px 12px 12px 12px;
    font-size: 15px;
    line-height: 1.5;
    word-break: break-word;
    white-space: pre-wrap;
  }

  /* 自己的消息：靠右、蓝色 */
  .msg.mine { flex-direction: row-reverse; }
  .msg.mine .body { margin-left: 0; margin-right: 10px; }
  .msg.mine .name { text-align: right; }
  .msg.mine .bubble {
    background: #4a6cf7;
    color: #fff;
    border-radius: 12px 4px 12px 12px;
  }

  /* 系统提示：居中灰色小字 */
  .system-msg {
    text-align: center;
    color: #aaa;
    font-size: 12px;
    margin: 10px 0;
  }

  footer {
    display: flex;
    gap: 10px;
    padding: 12px 14px;
    border-top: 1px solid #ececec;
    background: #fff;
    flex-shrink: 0;
  }
  #text-input {
    flex: 1;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    outline: none;
  }
  #text-input:focus { border-color: #4a6cf7; }
  #send-btn {
    border: none;
    background: #4a6cf7;
    color: #fff;
    border-radius: 8px;
    padding: 0 22px;
    font-size: 15px;
    cursor: pointer;
  }
  #send-btn:disabled, #text-input:disabled { opacity: .5; }

  /* 进入聊天室时的昵称弹窗 */
  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.45);
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 10;
  }
  .overlay.hidden { display: none; }
  .login-card {
    background: #fff;
    border-radius: 14px;
    padding: 28px;
    width: min(320px, 86vw);
    text-align: center;
  }
  .login-card h2 { font-size: 18px; margin-bottom: 18px; }
  #name-input {
    width: 100%;
    border: 1px solid #ddd;
    border-radius: 8px;
    padding: 10px 12px;
    font-size: 15px;
    outline: none;
    margin-bottom: 12px;
  }
  #name-input:focus { border-color: #4a6cf7; }
  #name-btn {
    width: 100%;
    border: none;
    background: #4a6cf7;
    color: #fff;
    border-radius: 8px;
    padding: 10px 0;
    font-size: 15px;
    cursor: pointer;
  }
</style>
</head>
<body>
  <div id="app">
    <header>
      <h1>💬 局域网聊天室</h1>
      <span id="me" class="me-badge"></span>
    </header>

    <!-- 起昵称的弹窗 -->
    <div id="login" class="overlay">
      <div class="login-card">
        <h2>进入聊天室</h2>
        <input id="name-input" placeholder="给自己起个昵称" maxlength="20" autofocus>
        <button id="name-btn">进入</button>
      </div>
    </div>

    <!-- 消息列表 -->
    <main id="chat">
      <div id="messages"></div>
    </main>

    <!-- 输入区 -->
    <footer>
      <input id="text-input" placeholder="输入消息，回车发送" maxlength="2000" disabled>
      <button id="send-btn" disabled>发送</button>
    </footer>
  </div>

<script>
const messagesBox = document.getElementById('messages');
const textInput   = document.getElementById('text-input');
const sendBtn     = document.getElementById('send-btn');
const overlay     = document.getElementById('login');
const nameInput   = document.getElementById('name-input');
const nameBtn     = document.getElementById('name-btn');
const meBadge     = document.getElementById('me');

let myName = localStorage.getItem('chat-name') || ''; // 记住上次用的昵称
let lastId = 0; // 已收到的最大消息编号，下次只拉它之后的新消息

// 把文本安全地显示到页面上（防止有人发 HTML 代码破坏页面）
function escapeHtml(text) {
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}

function appendMessage(m) {
  if (m.system) {
    const el = document.createElement('div');
    el.className = 'system-msg';
    el.textContent = m.text;
    messagesBox.appendChild(el);
  } else {
    const el = document.createElement('div');
    el.className = 'msg' + (m.name === myName ? ' mine' : '');
    el.innerHTML = `
      <div class="avatar">${escapeHtml(m.name.slice(0, 1))}</div>
      <div class="body">
        <div class="name">${escapeHtml(m.name)} · ${m.time}</div>
        <div class="bubble">${escapeHtml(m.text)}</div>
      </div>`;
    messagesBox.appendChild(el);
  }
  messagesBox.scrollTop = messagesBox.scrollHeight; // 自动滚到底部
}

// 每秒向服务器要一次新消息（轮询）
async function poll() {
  try {
    const res = await fetch(`/messages?after=${lastId}`);
    const data = await res.json();
    for (const m of data.messages) {
      appendMessage(m);
      lastId = m.id;
    }
  } catch (e) { /* 网络瞬断时忽略，下一秒自动重试 */ }
}

async function send() {
  const text = textInput.value.trim();
  if (!text) return;
  textInput.value = '';
  try {
    await fetch('/send', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ name: myName, text: text }),
    });
    poll(); // 发完立刻拉一次新消息，不用等下一秒
  } catch (e) {
    alert('发送失败，请检查网络后重试');
    textInput.value = text;
  }
}

function enterRoom() {
  const name = nameInput.value.trim();
  if (!name) { nameInput.focus(); return; }
  myName = name;
  localStorage.setItem('chat-name', name);
  meBadge.textContent = '我：' + name;
  overlay.classList.add('hidden');
  textInput.disabled = false;
  sendBtn.disabled = false;
  textInput.focus();
  fetch('/join', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({ name: name }),
  });
}

sendBtn.onclick = send;
textInput.onkeydown = e => { if (e.key === 'Enter') send(); };
nameBtn.onclick = enterRoom;
nameInput.onkeydown = e => { if (e.key === 'Enter') enterRoom(); };

// 上次来过（已有昵称）就直接进房间
if (myName) {
  nameInput.value = myName;
  enterRoom();
} else {
  nameInput.focus();
}

setInterval(poll, 1000);
</script>
</body>
</html>
